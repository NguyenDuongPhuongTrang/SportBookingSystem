spring.application.name=IT211Project

#config datasource
spring.datasource.url=jdbc:mysql://localhost:3306/projectIT211?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=061006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#config jpa
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dev: Disable Thymeleaf cache so template changes reload without server restart
spring.thymeleaf.cache=false
# Disable static resources caching for dev
spring.web.resources.cache.period=0