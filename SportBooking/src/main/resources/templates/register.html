<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng ký - Sport Booking')}"></head>
<body>

    <!-- Shared Navigation -->
    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main class="container">
        <div class="form-container glass">
            <div class="form-header">
                <h2>Tạo tài khoản mới</h2>
                <p>Khởi đầu những trận đấu đỉnh cao cùng chúng tôi</p>
            </div>
            
            <form id="register-form" onsubmit="handleRegisterSubmit(event)" novalidate>
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="email">Địa chỉ Email</label>
                    <input type="email" id="email" class="form-control" placeholder="example@domain.com" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password">
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Xác nhận mật khẩu</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Nhập lại mật khẩu" required autocomplete="new-password">
                </div>
                
                <button type="submit" class="submit-btn" id="register-btn">
                    <span id="btn-text">Đăng ký tài khoản</span>
                    <i class="fa-solid fa-spinner fa-spin" id="btn-spinner" style="display: none;"></i>
                </button>
            </form>
            
            <div class="form-footer">
                Đã có tài khoản? <a href="/login">Đăng nhập tại đây</a>
            </div>
        </div>
    </main>

    <!-- Shared Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        // Helper email validation
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        if (localStorage.getItem("accessToken")) {
            window.location.href = "/";
        }

        async function handleRegisterSubmit(event) {
            event.preventDefault();
            
            const usernameInput = document.getElementById("username");
            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            const confirmPasswordInput = document.getElementById("confirm-password");
            
            // Clear old errors
            clearFormErrors(document.getElementById("register-form"));
            
            let hasError = false;
            
            if (!usernameInput.value.trim()) {
                showFieldError(usernameInput, "Vui lòng nhập tên đăng nhập.");
                hasError = true;
            } else if (usernameInput.value.trim().length < 4) {
                showFieldError(usernameInput, "Tên đăng nhập phải chứa ít nhất 4 ký tự.");
                hasError = true;
            }
            
            if (!emailInput.value.trim()) {
                showFieldError(emailInput, "Vui lòng nhập địa chỉ email.");
                hasError = true;
            } else if (!validateEmail(emailInput.value)) {
                showFieldError(emailInput, "Định dạng email không hợp lệ.");
                hasError = true;
            }
            
            if (!passwordInput.value) {
                showFieldError(passwordInput, "Vui lòng nhập mật khẩu.");
                hasError = true;
            } else if (passwordInput.value.length < 6) {
                showFieldError(passwordInput, "Mật khẩu phải chứa ít nhất 6 ký tự.");
                hasError = true;
            }
            
            if (!confirmPasswordInput.value) {
                showFieldError(confirmPasswordInput, "Vui lòng nhập lại mật khẩu.");
                hasError = true;
            } else if (passwordInput.value !== confirmPasswordInput.value) {
                showFieldError(confirmPasswordInput, "Mật khẩu xác nhận không khớp.");
                hasError = true;
            }
            
            if (hasError) return;
            
            const btnText = document.getElementById("btn-text");
            const btnSpinner = document.getElementById("btn-spinner");
            const registerBtn = document.getElementById("register-btn");
            
            // Disable buttons
            registerBtn.disabled = true;
            btnText.style.display = "none";
            btnSpinner.style.display = "inline-block";
            
            try {
                const response = await fetch("/api/v1/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: usernameInput.value.trim(),
                        email: emailInput.value.trim(),
                        password: passwordInput.value
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && (result.status === 201 || result.status === 200)) {
                    showToast("Đăng ký thành công! Đang chuyển hướng sang đăng nhập...");
                    setTimeout(() => {
                        window.location.href = "/login";
                    }, 1500);
                } else {
                    if (result.errors) {
                        for (const [field, msg] of Object.entries(result.errors)) {
                            const input = document.getElementById(field);
                            if (input) showFieldError(input, msg);
                        }
                    } else {
                        showToast(result.message || "Đăng ký thất bại! Vui lòng thử lại.", "error");
                    }
                }
            } catch (error) {
                console.error("Lỗi register:", error);
                showToast("Lỗi kết nối máy chủ!", "error");
            } finally {
                registerBtn.disabled = false;
                btnText.style.display = "inline";
                btnSpinner.style.display = "none";
            }
        }
    </script>
</body>
</html>
